name: Live Copilot integration

on:
  workflow_dispatch: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  models:
    permissions:
      contents: read
      copilot-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test usage accounting
        run: npm test
      - name: Start Copilot proxy
        id: proxy
        uses: ./
      - name: Query Copilot model catalog through localhost
        env:
          GITHUB_TOKEN: unused-client-key
          COPILOT_MODELS_URL: ${{ steps.proxy.outputs.base-url }}/models
        run: python3 scripts/list_models.py
      - name: Test JSON and streamed inference usage
        env:
          OPENAI_BASE_URL: ${{ steps.proxy.outputs.base-url }}
        run: node scripts/test-inference.cjs
      - name: Upload catalog and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-models
          path: |
            results/
            ${{ steps.proxy.outputs.usage-file }}
          if-no-files-found: warn
          retention-days: 7

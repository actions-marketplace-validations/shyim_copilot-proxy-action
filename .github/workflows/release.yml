# Adapted from shopware/setup-shopware/.github/workflows/release.yml.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: Tag name that the major tag will point to
        required: true
        type: string

concurrency:
  group: release-tags
  cancel-in-progress: false

permissions: {}

jobs:
  update_tag:
    name: Update major version tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    environment: Release
    steps:
      - name: Update the major tag
        uses: actions/publish-action@23f4c6f12633a2da8f44938b71fde9afec138fb4 # v0.4.0
        with:
          source-tag: ${{ inputs.TAG_NAME || github.event.release.tag_name }}
